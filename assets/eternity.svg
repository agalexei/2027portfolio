  <circle cx="320" cy="320" r="292" fill="url(#halo)"/>
  <circle cx="320" cy="320" r="248" stroke="#7f2136" stroke-opacity=".58" stroke-dasharray="1 8"/>
  <circle cx="320" cy="320" r="236" stroke="#491d27" stroke-opacity=".58"/>
  <g transform="translate(94.6 94.6) scale(.98)">
