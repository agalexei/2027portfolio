    <path id="outline" d="M151.7 42.3A116 116 0 0 1 307.36 41.91 116 116 0 0 1 417.7 151.7 116 116 0 0 1 418.09 307.36 116 116 0 0 1 308.3 417.7 116 116 0 0 1 152.64 418.09 116 116 0 0 1 42.3 308.3 116 116 0 0 1 41.91 152.64 116 116 0 0 1 151.7 42.3Z"/>
