<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none">
  <defs>
    <radialGradient id="halo">
      <stop offset=".37" stop-color="#701025" stop-opacity=".08"/>
      <stop offset=".68" stop-color="#ff003d" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff003d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="enamel" x1="54" y1="400" x2="385" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#430a19"/>
      <stop offset=".49" stop-color="#a91233"/>
      <stop offset="1" stop-color="#500b20"/>
    </linearGradient>
    <linearGradient id="rim" x1="44" y1="392" x2="407" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8d1b34"/>
      <stop offset=".46" stop-color="#ff2b51"/>
      <stop offset=".75" stop-color="#ff5273"/>
      <stop offset="1" stop-color="#9b1632"/>
